# Scenario 07 - Bring the database in directly: the collector scrapes Postgres's
# own pg_stat_* views via the `postgresql` receiver, tagged service.name=postgres
# so it lands in Grafana as its own service - no app code involved at all.
#   ./scripts/scenario.sh 07
#   Prometheus: postgresql_backends, postgresql_rows, ...

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:5173"
          allowed_headers:
            - "*"

  postgresql:
    endpoint: postgres:5432
    username: demo
    password: demo
    databases: [shop]
    collection_interval: 10s
    tls:
      insecure: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    timeout: 2s

  resource:
    attributes:
      - key: deployment.environment.name
        value: demo
        action: upsert
      - key: team
        value: checkout
        action: upsert

  resource/postgres:
    attributes:
      - key: service.name
        value: postgres
        action: upsert
      - key: deployment.environment.name
        value: demo
        action: upsert

  filter/traces:
    error_mode: ignore
    traces:
      span:
        - attributes["http.route"] == "/api/health"
        - attributes["url.path"] == "/api/health"

  batch: {}

exporters:
  debug:
    verbosity: basic
  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, filter/traces, batch]
      exporters: [otlp/lgtm, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp/lgtm, debug]
    metrics/postgres:
      receivers: [postgresql]
      processors: [memory_limiter, resource/postgres, batch]
      exporters: [otlp/lgtm, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp/lgtm, debug]
