# Scenario 06 - Metrics generated from traces: spanmetrics turns every span into RED metrics.
# Built on scenario 04 (filter), not 05 (tail_sampling) - sampling before spanmetrics would
# skew the generated rate/duration metrics.
#   ./scripts/scenario.sh 06
#   Grafana Explore -> Prometheus -> traces_span_metrics_calls_total

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:5173"
          allowed_headers:
            - "*"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    timeout: 2s

  resource:
    attributes:
      - key: deployment.environment.name
        value: demo
        action: upsert
      - key: team
        value: checkout
        action: upsert

  filter/traces:
    error_mode: ignore
    traces:
      span:
        - attributes["http.route"] == "/api/health"
        - attributes["url.path"] == "/api/health"

  batch: {}

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
    dimensions:
      - name: http.route
      - name: http.method
      - name: http.status_code
    metrics_flush_interval: 5s

exporters:
  debug:
    verbosity: basic
  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, filter/traces, batch]
      exporters: [otlp/lgtm, spanmetrics, debug]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp/lgtm, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp/lgtm, debug]
