# Scenario 02 - Enrich: adds resourcedetection (auto env attributes), resource (fixed metadata),
# and attributes (a marker attribute on every span).
#   ./scripts/scenario.sh 02

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:5173"
          allowed_headers:
            - "*"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    timeout: 2s

  resource:
    attributes:
      - key: deployment.environment.name
        value: demo
        action: upsert
      - key: team
        value: checkout
        action: upsert
      - key: cloud.region
        value: eu-west-2
        action: upsert

  attributes/mark:
    actions:
      - key: demo.stage
        value: enrich
        action: upsert

  batch: {}

exporters:
  debug:
    verbosity: basic
  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, attributes/mark, batch]
      exporters: [otlp/lgtm, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp/lgtm, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp/lgtm, debug]
