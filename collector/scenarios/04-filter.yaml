# Scenario 04 - Filter: on top of scenario 03, drops health-check spans/datapoints and
# anything below INFO severity from logs.
#   ./scripts/scenario.sh 04

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:5173"
          allowed_headers:
            - "*"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    timeout: 2s

  resource:
    attributes:
      - key: deployment.environment.name
        value: demo
        action: upsert
      - key: team
        value: checkout
        action: upsert

  transform/mask_email:
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["customer.email"], "^(.)[^@]*(@.*)$", "$$1***$$2") where attributes["customer.email"] != nil
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "^(.)[^@\\s]*(@[^\\s]*)", "$$1***$$2") where IsString(body)

  redaction/card:
    allow_all_keys: true
    blocked_values:
      - '(?:\d[ -]*?){13,16}'
    summary: debug

  filter/traces:
    error_mode: ignore
    traces:
      span:
        - attributes["http.route"] == "/api/health"
        - attributes["url.path"] == "/api/health"

  filter/metrics:
    error_mode: ignore
    metrics:
      datapoint:
        - attributes["http.route"] == "/api/health"
        - attributes["url.path"] == "/api/health"

  filter/logs:
    error_mode: ignore
    logs:
      log_record:
        - severity_number < SEVERITY_NUMBER_INFO

  batch: {}

exporters:
  debug:
    verbosity: basic
  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, transform/mask_email, redaction/card, filter/traces, batch]
      exporters: [otlp/lgtm, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, filter/metrics, batch]
      exporters: [otlp/lgtm, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, transform/mask_email, redaction/card, filter/logs, batch]
      exporters: [otlp/lgtm, debug]
